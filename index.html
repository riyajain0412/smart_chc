        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

        .sc-root {
          --bg: #F5F8F6;
          --surface: #FFFFFF;
          --border: #DEE7E1;
          --ink: #16281E;
          --ink-soft: #5B6E63;
          --green-600: #1B7A43; --green-50: #E7F5EC; --green-700: #125C32;
          --blue-600: #1D5FA3; --blue-50: #E9F2FB;
          --amber-600: #B7791F; --amber-50: #FDF3E1;
          --red-600: #C0392B; --red-50: #FBEAE8;
          --grade-a: #1B7A43; --grade-b: #1D5FA3; --grade-c: #B7791F; --grade-d: #C2691A; --grade-e: #C0392B;
          font-family: 'IBM Plex Sans', -apple-system, sans-serif;
          background: var(--bg);
          color: var(--ink);
          min-height: 100vh;
          width: 100%;
        }
        .sc-root * { box-sizing: border-box; }
        .sc-mono { font-family: 'IBM Plex Mono', monospace; }
        .sc-muted { color: var(--ink-soft); font-size: 13px; line-height: 1.5; }
        .sc-mt { margin-top: 14px; } .sc-mt-sm { margin-top: 6px; } .sc-mb { margin-bottom: 14px; }

        /* Login */
        .sc-login { max-width: 760px; margin: 0 auto; padding: 48px 20px 60px; }
        .sc-login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
        .sc-login-mark { width: 40px; height: 40px; border-radius: 10px; background: var(--green-600); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .sc-login-mark.small { width: 30px; height: 30px; border-radius: 8px; }
        .sc-login-title { font-weight: 700; font-size: 18px; letter-spacing: 0.02em; }
        .sc-login-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
        .sc-login-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px; }
        .sc-eyebrow { text-transform: uppercase; letter-spacing: 0.09em; font-size: 11px; font-weight: 600; color: var(--green-700); }
        .sc-login-panel h1 { font-size: 22px; margin: 6px 0 8px; }
        .sc-role-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin: 22px 0; }
        .sc-role-card { text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 14px; cursor: pointer; transition: border-color .15s, background .15s; color: var(--ink); } .sc-login-hierarchy { display:flex; align-items:center; justify-content:center; gap:8px; margin:18px 0 4px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--ink-soft); font-size:12px; font-weight:600; } .sc-tabs { display:flex; gap:6px; } .sc-tab { border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); border-radius:8px; padding:8px 12px; cursor:pointer; font-weight:600; } .sc-tab.is-active { background:var(--green-50); border-color:var(--green-600); color:var(--green-700); }
        .sc-role-card:hover { border-color: var(--green-600); }
        .sc-role-card.is-active { border-color: var(--green-600); background: var(--green-50); }
        .sc-role-card svg { color: var(--green-600); margin-bottom: 8px; }
        .sc-role-label { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .sc-role-desc { font-size: 12px; color: var(--ink-soft); line-height: 1.4; }
        .sc-login-select { margin-top: 8px; margin-bottom: 18px; }
        .sc-login-select label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
        .sc-login-select select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-size: 14px; color: var(--ink); }
        .sc-login-go { width: 100%; justify-content: center; }
        .sc-login-footer { text-align: center; font-size: 11px; color: var(--ink-soft); margin-top: 20px; }

        /* Buttons */
        .sc-btn-primary { display: inline-flex; align-items: center; gap: 6px; background: var(--green-600); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
        .sc-btn-primary:hover { background: var(--green-700); }
        .sc-btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
        .sc-btn-ghost { display: inline-flex; align-items: center; gap: 6px; background: transparent; color: var(--ink); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; }
        .sc-btn-ghost:hover { border-color: var(--ink-soft); }
        .sc-btn-tiny { display: inline-flex; align-items: center; gap: 4px; background: var(--blue-50); color: var(--blue-600); border: 1px solid rgba(29,95,163,0.3); padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }

        /* Topbar / layout */
        .sc-topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
        .sc-topbar-left { display: flex; align-items: center; gap: 10px; }
        .sc-topbar-title { font-weight: 700; font-size: 14.5px; }
        .sc-topbar-context { font-size: 12px; color: var(--ink-soft); }
        .sc-topbar-right { display: flex; align-items: center; gap: 8px; }
        .sc-sync-btn { font-size: 12px; }
        .sc-loading { display: flex; align-items: center; gap: 10px; justify-content: center; height: 60vh; color: var(--ink-soft); font-size: 14px; }
        .sc-live-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--green-700); background: var(--green-50); padding: 5px 10px; border-radius: 999px; }
        .sc-live-badge-inline { margin-left: 10px; font-size: 11px; padding: 3px 8px; }
        .sc-live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-600); display: inline-block; box-shadow: 0 0 0 0 rgba(27,122,67,0.5); animation: sc-pulse 1.8s infinite; }
        .sc-live-dot-spin { background: var(--blue-600); animation: sc-spin-dot 0.8s linear infinite; }
        @keyframes sc-pulse { 0% { box-shadow: 0 0 0 0 rgba(27,122,67,0.45); } 70% { box-shadow: 0 0 0 6px rgba(27,122,67,0); } 100% { box-shadow: 0 0 0 0 rgba(27,122,67,0); } }
        @keyframes sc-spin-dot { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .sc-page { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; display: flex; flex-direction: column; gap: 18px; }

        .sc-section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .sc-section-heading h2 { font-size: 20px; margin: 2px 0 0; }
        .sc-month-switch { display: flex; align-items: center; gap: 10px; }
        .sc-month-switch select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; background: #fff; }

        /* Cards */
        .sc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
        .sc-card-title { font-weight: 600; font-size: 14.5px; margin-bottom: 12px; }

        /* KPI cards */
        .sc-kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .sc-kpi-grid-3 { grid-template-columns: repeat(3, 1fr); }
        .sc-kpi { display: flex; align-items: flex-start; gap: 12px; padding: 16px; }
        .sc-kpi-icon { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .sc-kpi-value { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 19px; line-height: 1.1; }
        .sc-kpi-label { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
        .sc-kpi-sub { font-size: 11px; color: var(--ink-soft); margin-top: 3px; }

        .sc-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media (max-width: 760px) { .sc-grid-2, .sc-kpi-grid-3 { grid-template-columns: 1fr; } }

        /* Grade badge */
        .sc-grade { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid; font-size: 12px; font-weight: 600; }
        .sc-grade-letter { font-family: 'IBM Plex Mono', monospace; font-weight: 700; }

        /* Progress */
        .sc-progress { display: inline-block; width: 90px; height: 7px; background: var(--border); border-radius: 999px; overflow: hidden; vertical-align: middle; }
        .sc-progress-fill { height: 100%; border-radius: 999px; }
        .sc-table-pct { font-size: 12px; color: var(--ink-soft); margin-left: 6px; }

        /* Table */
        .sc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .sc-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border); }
        .sc-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        .sc-table tr:last-child td { border-bottom: none; }
        .sc-table-sub { font-size: 11px; color: var(--ink-soft); }
        .sc-neg { color: var(--red-600); font-weight: 600; }
        .sc-row-highlight td { background: var(--green-50); }

        /* Pills / alerts */
        .sc-pill { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
        .sc-pill-green { background: var(--green-50); color: var(--green-700); }
        .sc-pill-blue { background: var(--blue-50); color: var(--blue-600); }
        .sc-pill-amber { background: var(--amber-50); color: var(--amber-600); }
        .sc-alert-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
        .sc-alert-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--red-600); background: var(--red-50); padding: 8px 10px; border-radius: 8px; }
        .sc-empty { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--green-700); background: var(--green-50); padding: 10px 12px; border-radius: 8px; }
        .sc-rec-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
        .sc-rec-list li { display: flex; gap: 6px; align-items: flex-start; }
        .sc-rec-list svg { flex-shrink: 0; margin-top: 3px; color: var(--green-600); }

        /* Tabs */
        .sc-tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); }
        .sc-tabs button { display: flex; align-items: center; gap: 6px; background: transparent; border: none; border-bottom: 2px solid transparent; padding: 10px 4px; margin-right: 18px; font-size: 13.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
        .sc-tabs button.is-active { color: var(--green-700); border-bottom-color: var(--green-600); }

        /* Forms */
        .sc-form { display: flex; flex-direction: column; gap: 12px; max-width: 560px; }
        .sc-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .sc-form label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; }
        .sc-form input, .sc-form select { padding: 9px 11px; border-radius: 7px; border: 1px solid var(--border); font-size: 13.5px; font-weight: 400; text-transform: none; letter-spacing: normal; color: var(--ink); font-family: inherit; }
        .sc-form input:focus, .sc-form select:focus, .sc-login-select select:focus { outline: 2px solid var(--blue-600); outline-offset: 1px; }
        .sc-inline-form-row td { background: var(--bg); }
        .sc-inline-form { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; padding: 8px 0; }
        .sc-inline-form label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--ink-soft); font-weight: 600; }
        .sc-inline-form input { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); width: 110px; }
        .sc-date-input { display: flex; align-items: center; gap: 8px; }

        .sc-methodology-toggle { display: flex; align-items: center; gap: 8px; width: 100%; background: transparent; border: none; font-size: 13.5px; font-weight: 600; color: var(--blue-600); cursor: pointer; padding: 0; }
        .sc-methodology-body { margin-top: 14px; }

        .sc-weight-row { display: flex; justify-content: space-between; font-size: 13px; background: var(--bg); padding: 7px 10px; border-radius: 6px; }
        .sc-weight-pct { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--green-700); }
        .sc-grade-table { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
        .sc-grade-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }

        .sc-standout-title { font-weight: 600; font-size: 15px; margin-bottom: 6px; }

        /* Modal / report */
        .sc-modal-backdrop { position: fixed; inset: 0; background: rgba(22,40,30,0.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }

        .sc-report-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px 0; }
        .sc-report-body { padding: 20px 28px 28px; }
        .sc-report-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 16px; }
        .sc-report-header h2 { margin: 4px 0 4px; font-size: 20px; }
        .sc-report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
        .sc-report-grid > div { display: flex; justify-content: space-between; background: var(--bg); padding: 9px 12px; border-radius: 8px; font-size: 13px; }
        .sc-report-grid strong { font-family: 'IBM Plex Mono', monospace; }
        .sc-report-section { margin-bottom: 14px; }
        .sc-report-section h3 { font-size: 13.5px; margin-bottom: 6px; }
        .sc-report-section ol { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.6; }
        .sc-report-footer { font-size: 11px; color: var(--ink-soft); margin-top: 10px; }
        @media print { .no-print { display: none; } .sc-modal-backdrop { position: static; background: none; } .sc-modal { max-height: none; box-shadow: none; } }
